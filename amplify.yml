version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "=== AMPLIFY ENV CHECK START ==="
        - echo "AWS_BRANCH=$AWS_BRANCH"
        - echo "MY_SECRET_SET=$([ -n "$MONGODB_URI" ] && echo yes || echo no)"
        - echo "MY_SECRET_SET=$([ -n "$NEXTAUTH_SECRET" ] && echo yes || echo no)"
        
       
        - echo "NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL"
        - echo "=== AMPLIFY ENV CHECK END ==="
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    # Next.js default output folder for Amplify Hosting is .next
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*