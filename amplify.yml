version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 20 && nvm use 20
        - echo "=== AMPLIFY ENV CHECK START ==="
        - echo "AWS_BRANCH=$AWS_BRANCH"
        - echo "MONGODB_URI_SET=$([ -n "$MONGODB_URI" ] && echo yes || echo no)"
        - echo "NEXTAUTH_SECRET_SET=$([ -n "$NEXTAUTH_SECRET" ] && echo yes || echo no)"
        - echo "NEXTAUTH_URL_SET=$([ -n "$NEXTAUTH_URL" ] && echo yes || echo no)"
        - echo "MEGA_EMAIL_SET=$([ -n "$MEGA_EMAIL" ] && echo yes || echo no)"
        - echo "MEGA_PASSWORD_SET=$([ -n "$MEGA_PASSWORD" ] && echo yes || echo no)"
        - echo "SEED_SECRET_SET=$([ -n "$SEED_SECRET" ] && echo yes || echo no)"
        - echo "NEXT_PUBLIC_API_URL_SET=$([ -n "$NEXT_PUBLIC_API_URL" ] && echo yes || echo no)"
        - env | grep -E '^(AWS_BRANCH|MONGODB_URI|NEXTAUTH_SECRET|NEXTAUTH_URL|SEED_SECRET|MEGA_EMAIL|MEGA_PASSWORD|NEXT_PUBLIC_API_URL)=' | sed 's/=.*$/=<set>/'
        - echo "=== AMPLIFY ENV CHECK END ==="
        - npm ci
    build:
      commands:
        - export MONGODB_URI=$MONGODB_URI
        - export NEXTAUTH_SECRET=$NEXTAUTH_SECRET
        - export NEXTAUTH_URL=$NEXTAUTH_URL
        - export SEED_SECRET=$SEED_SECRET
        - export MEGA_EMAIL=$MEGA_EMAIL
        - export MEGA_PASSWORD=$MEGA_PASSWORD
        - npm run build
        - rm -rf .amplify-hosting
        - mkdir -p .amplify-hosting/compute/default/.next
        - cp deploy-manifest.json .amplify-hosting/deploy-manifest.json
        - cp amplify-entrypoint.cjs .amplify-hosting/compute/default/index.js
        - cp -r .next/standalone/. .amplify-hosting/compute/default/
        - cp -r .next/static .amplify-hosting/compute/default/.next/static
        - mkdir -p .amplify-hosting/.next
        - cp .next/required-server-files.json .amplify-hosting/required-server-files.json
        - cp .next/required-server-files.json .amplify-hosting/.next/required-server-files.json
        - cp .next/required-server-files.json .amplify-hosting/compute/default/required-server-files.json
        - if [ -d public ]; then cp -r public .amplify-hosting/compute/default/public; fi
        - env | grep -E '^(MONGODB_URI|NEXTAUTH_SECRET|NEXTAUTH_URL|SEED_SECRET|MEGA_EMAIL|MEGA_PASSWORD|NEXT_PUBLIC_API_URL|NODE_ENV)=' > .amplify-hosting/compute/default/.env
  artifacts:
    baseDirectory: .amplify-hosting
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
