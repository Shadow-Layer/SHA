
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "=== AMPLIFY ENV CHECK START ==="
        - echo "BRANCH=$AWS_BRANCH"
        - echo "$MONGODB_URI=$NEXTAUTH_SECRET=$NEXTAUTH_URL=$MEGA_EMAIL=$MEGA_PASSWORD=$SEED_SECRET"
        - echo "NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL"
        - echo "=== AMPLIFY ENV CHECK END ==="
        - npm ci
    build:
      commands:
        - npm run build