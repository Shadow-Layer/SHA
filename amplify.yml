version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        - env | cut -d= -f1 | sort
        - for v in MONGODB_URI NEXTAUTH_SECRET NEXTAUTH_URL SEED_SECRET MEGA_EMAIL MEGA_PASSWORD; do if [ -n "${!v}" ]; then echo "$v=set"; else echo "$v=missing"; fi; done
        - echo "=== ENV VARIABLES ==="
        - printenv | sort
        - echo "=== FILTERED ==="
        - printenv | grep -E 'AWS_|NEXT_PUBLIC_|MY_SECRET'
        - npm run build
        
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
