version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "=== CHECKING AMPLIFY ENV VARS ==="
        - echo "MY_SECRET=$MY_SECRET"
        - echo "NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL"
        - printenv | grep MY_SECRET || true
        - npm ci
        - npm ci
    build:
      commands:
        - npm run build
        
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
